# Security and version updates as pull requests, checked by the same CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # One pull request for minor and patch updates; majors arrive one by one.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  # The images in docker-compose.yml: Postgres and the Prism mock.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Keep Prism in step with the dev dependency by hand; 5.15.10 crashes on start.
      - dependency-name: stoplight/prism
