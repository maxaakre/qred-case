name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails if the spec is invalid or src/generated/api.ts is out of date with it.
      - run: npm run spec:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same version as local development and production: one source of truth.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Testcontainers starts Postgres using the runner's Docker.
      - run: npm test

  breaking-changes:
    name: No breaking API changes
    # Compares the spec in the pull request with the one on the target branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Fails if a change would break an app already in users' hands: a removed or
      # renamed field, a response field that became optional, a new required input.
      # Adding optional fields and new endpoints is allowed.
      - uses: oasdiff/oasdiff-action/breaking@v0.1.18
        with:
          base: origin/${{ github.base_ref }}:openapi/openapi.yaml
          revision: HEAD:openapi/openapi.yaml
          fail-on: ERR
          # Keep the spec inside CI.
          review: false
