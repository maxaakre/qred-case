name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code. Actions are pinned to a commit, so a moved tag cannot change what runs.
permissions:
  contents: read

# A new push replaces a pull request's older run. On main every commit keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Contract, lint, types and build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Known vulnerabilities in what ships. Dev tools (Prism, Redocly) never reach production.
      - run: npm audit --omit=dev --audit-level=high
      # Fails if the spec is invalid or src/generated/api.ts is out of date with it.
      - run: npm run spec:check
      - run: npm run lint
      - run: npm run typecheck
      # The production build must compile and include the spec and migrations it reads at runtime.
      - run: npm run build && test -f dist/openapi/openapi.yaml && test -d dist/db/migrations

  test:
    name: Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same version as local development and production: one source of truth.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Testcontainers starts Postgres using the runner's Docker. Fails below the coverage
      # floor in vitest.config.ts.
      - run: npm run test:coverage

  breaking-changes:
    name: No breaking API changes
    timeout-minutes: 10
    # Compares the spec in the pull request with the one on the target branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Fails if a change would break an app already in users' hands: a removed or
      # renamed field, a response field that became optional, a new required input.
      # Adding optional fields and new endpoints is allowed.
      - uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: origin/${{ github.base_ref }}:openapi/openapi.yaml
          revision: HEAD:openapi/openapi.yaml
          fail-on: ERR
          # Keep the spec inside CI.
          review: false

  docker:
    name: docker compose up
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The whole stack as a reviewer starts it: image build, migrations, demo data, API and mock.
      - run: docker compose up -d --build
      - run: ./scripts/docker-smoke.sh
      - if: always()
        run: docker compose down -v
