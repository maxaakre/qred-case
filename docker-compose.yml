# docker compose up  →  Postgres, migrations + demo data, the API on :3000 and the mock on :4010.

x-app-env: &app-env
  DATABASE_URL: postgres://app:app@db:5432/cards
  # Read from your .env when it exists, so `npm run token` signs tokens this API accepts.
  # The default is for local demos only.
  JWT_SECRET: ${JWT_SECRET:-local-demo-secret-do-not-use-in-production}
  # The image runs with NODE_ENV=production, where these have no defaults.
  JWT_ISSUER: ${JWT_ISSUER:-card-overview-dev}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-card-overview-api}
  SUPPORT_PHONE: ${SUPPORT_PHONE:-+46 8 000 00 00}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@example.com}
  SUPPORT_URL: ${SUPPORT_URL:-https://example.com/support}
  LOG_LEVEL: ${LOG_LEVEL:-info}

# The app containers cannot change their own files or gain privileges, so a compromised
# process has as little to work with as possible.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: cards
    volumes:
      # Creates the API's login on first start (db/init/01-app-login.sql).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Only this machine: the demo passwords are public, so nobody else on the network may connect.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d cards"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Runs once and exits, as the schema owner: migrations, then demo data. Every `up` resets the demo data.
  setup:
    build: .
    image: card-overview-api:local
    command: ["sh", "-c", "node dist/scripts/migrate.js && node dist/scripts/seed.js"]
    environment:
      <<: *app-env
      # The seed deletes all data, so the production image refuses to run it without this.
      ALLOW_DEMO_SEED: "true"
    <<: *hardened
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    image: card-overview-api:local
    environment:
      <<: *app-env
      # Only the privileges the app needs (migration 003). Migrations run as the owner in setup.
      DATABASE_URL: postgres://card_api:card_api@db:5432/cards
      # POST /demo/token and prefilled ids on /docs (ADR 0009). Never in production.
      DEMO_MODE: "true"
      # The image runs with NODE_ENV=production, where demo mode also needs this switch.
      ALLOW_DEMO_MODE: "true"
      # Off by default in production (NODE_ENV=production in the image).
      DOCS_ENABLED: "true"
    <<: *hardened
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  # The contract as a mock server, for frontend work without the backend.
  mock:
    # Older than the dev dependency (5.16.0), which has no Docker image yet; 5.15.10 crashes on start.
    # Both serve the same contract.
    image: stoplight/prism:5.14.2
    # Published for amd64 only; Apple Silicon runs it emulated.
    platform: linux/amd64
    command: ["mock", "-h", "0.0.0.0", "/spec/openapi.yaml"]
    volumes:
      - ./openapi:/spec:ro
    ports:
      - "127.0.0.1:4010:4010"
