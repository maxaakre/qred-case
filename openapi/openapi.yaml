openapi: 3.0.3
info:
  title: Card Overview API
  version: 1.0.0
  description: |
    Backend for the card overview screen in the mobile app.

    This file is the contract. It is written and agreed on before any backend
    code exists, so frontend can build against a mock server from day one:

        npm run mock   # Prism mock server on http://localhost:4010

    Conventions:
    - Money is `{ minor, currency }` where `minor` is an integer in minor units (öre).
      Formatting ("5 400 kr") is a client concern, so it follows the user's locale.
    - Timestamps are ISO 8601 in UTC. Dates without time are `YYYY-MM-DD`.
    - Errors use RFC 9457 `application/problem+json`.
    - Auth: `Authorization: Bearer <token>`. The token identifies the user.
servers:
  - url: http://localhost:3000
    description: Local backend
  - url: http://localhost:4010
    description: Prism mock server

security:
  - bearerAuth: []

tags:
  - name: Companies
    description: Companies the signed-in user belongs to
  - name: Cards
    description: The user's card, spend, transactions and actions
  - name: System
    description: Operational endpoints

paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Liveness and database readiness
      security: []
      responses:
        '200':
          description: Service and database are up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/me/companies:
    get:
      operationId: listMyCompanies
      tags: [Companies]
      summary: Companies the user belongs to (the company dropdown)
      responses:
        '200':
          description: The user's companies, sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CompanySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/companies/{companyId}/card-overview:
    get:
      operationId: getCardOverview
      tags: [Cards]
      summary: Everything the card overview screen needs, in one call
      description: |
        Screen-shaped (Backend-for-Frontend) endpoint. Returns the signed-in
        user's card in the selected company with spend, latest transactions,
        the next invoice due and which actions are allowed.

        If the user is a member of the company but has no card there, `card`
        and everything that depends on it is `null`, so the app can show an
        empty state instead of an error.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Overview for the selected company
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardOverview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cards/{cardId}/transactions:
    get:
      operationId: listCardTransactions
      tags: [Cards]
      summary: Paginated transactions for a card ("54 more items" view)
      description: |
        Newest first. Cursor-based pagination, so new transactions arriving
        while the user scrolls never cause duplicates or skipped rows.
      parameters:
        - $ref: '#/components/parameters/CardId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: Opaque value from `nextCursor` of the previous page
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: One page of transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cards/{cardId}/activation:
    post:
      operationId: activateCard
      tags: [Cards]
      summary: Activate the card ("Activate card" button)
      description: |
        Idempotent. Activating an already active card returns `200` with the
        card, so a double tap or a network retry is safe. Only the card holder
        can activate, and only from `INACTIVE` (or already `ACTIVE`).
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: The card is active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Money:
      type: object
      required: [minor, currency]
      properties:
        minor:
          type: integer
          description: Amount in minor units (öre). 540000 = 5 400,00 kr
          example: 540000
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: SEK

    CompanySummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Company AB }

    CardStatus:
      type: string
      enum: [INACTIVE, ACTIVE, FROZEN, CLOSED]

    Card:
      type: object
      required: [id, last4, status, imageUrl]
      properties:
        id: { type: string, format: uuid }
        last4: { type: string, pattern: '^[0-9]{4}$', example: '4821' }
        status: { $ref: '#/components/schemas/CardStatus' }
        imageUrl: { type: string, format: uri }

    InvoiceDue:
      type: object
      required: [id, amount, dueDate, isOverdue]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        dueDate: { type: string, format: date, example: '2026-10-30' }
        isOverdue: { type: boolean }

    Spend:
      type: object
      description: |
        Spend in the current calendar month (Europe/Stockholm) against the
        limit the user set. Pending and settled purchases count, refunds
        reduce spend, declined transactions are ignored.
      required: [spent, limit, remaining, periodStart, periodEnd]
      properties:
        spent: { $ref: '#/components/schemas/Money' }
        limit: { $ref: '#/components/schemas/Money' }
        remaining:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: max(limit - spent, 0). Never negative.
        periodStart: { type: string, format: date }
        periodEnd:
          type: string
          format: date
          description: Last day of the period (inclusive)

    Transaction:
      type: object
      required: [id, merchant, amount, status, occurredAt]
      properties:
        id: { type: string, format: uuid }
        merchant: { type: string, example: Clas Ohlson }
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Negative = purchase, positive = refund
        status:
          type: string
          enum: [PENDING, SETTLED, DECLINED]
        occurredAt: { type: string, format: date-time }

    LatestTransactions:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Transaction' }
        totalCount:
          type: integer
          minimum: 0
          description: All transactions on the card. "N more" = totalCount - items.length

    Actions:
      type: object
      description: Decided by the backend so business rules live in one place
      required: [canActivateCard]
      properties:
        canActivateCard: { type: boolean }

    Support:
      type: object
      required: [phone, email, url]
      properties:
        phone: { type: string, example: '+46 8 000 00 00' }
        email: { type: string, format: email }
        url: { type: string, format: uri }

    CardOverview:
      type: object
      required: [company, card, invoiceDue, spend, latestTransactions, actions, support]
      properties:
        company: { $ref: '#/components/schemas/CompanySummary' }
        card:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Card' }]
        invoiceDue:
          type: object
          nullable: true
          description: The oldest unpaid invoice. null when nothing is due.
          allOf: [{ $ref: '#/components/schemas/InvoiceDue' }]
        spend:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Spend' }]
        latestTransactions:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/LatestTransactions' }]
        actions: { $ref: '#/components/schemas/Actions' }
        support: { $ref: '#/components/schemas/Support' }

    TransactionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        nextCursor:
          type: string
          nullable: true
          description: null on the last page

    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type: { type: string, example: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

  responses:
    BadRequest:
      description: Invalid input (bad id, limit or cursor)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: |
        Not found, or the user has no access. We do not reveal whether a
        resource exists to users who cannot see it.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The card is in a state that cannot be activated (FROZEN or CLOSED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Database not reachable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
