openapi: 3.1.0
info:
  title: Card Overview API
  version: 1.0.0
  description: |
    Backend for the card overview screen in the mobile app.

    This file is the contract. It is written and agreed on before any backend
    code exists, so frontend can build against a mock server from day one:

        npm run mock   # Prism mock server on http://localhost:4010

    Conventions:
    - Money is `{ minor, currency }` where `minor` is an integer in minor units (öre).
      Formatting ("5 400 kr") is a client concern, so it follows the user's locale.
    - Timestamps are ISO 8601 in UTC. Dates without time are `YYYY-MM-DD`.
    - Errors use RFC 9457 `application/problem+json`.
    - Auth: `Authorization: Bearer <token>`. The token identifies the user.
    - Every response has an `X-Request-Id` header. Send your own (letters,
      digits, `.`, `_`, `-`, max 128) to follow one request from the app
      through the backend logs; otherwise the backend creates one.
servers:
  - url: http://localhost:3000
    description: Local backend
  - url: http://localhost:4010
    description: Prism mock server

security:
  - bearerAuth: []

tags:
  - name: Companies
    description: Companies the signed-in user belongs to
  - name: Cards
    description: The user's card, spend, transactions and actions
  - name: System
    description: Operational endpoints

paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Liveness and database readiness
      security: []
      responses:
        '200':
          description: Service and database are up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/me/companies:
    get:
      operationId: listMyCompanies
      tags: [Companies]
      summary: Companies the user belongs to (the company dropdown)
      responses:
        '200':
          description: The user's companies, sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CompanySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/companies/{companyId}/card-overview:
    get:
      operationId: getCardOverview
      tags: [Cards]
      summary: Everything the card overview screen needs, in one call
      description: |
        Screen-shaped (Backend-for-Frontend) endpoint. Returns the signed-in
        user's card in the selected company with spend, latest transactions,
        the next invoice due and which actions are allowed.

        Card selection: the user's most recently created card in the company
        that is not `CLOSED`. `FROZEN` cards are shown so the user understands
        why the card does not work.

        If the user is a member of the company but has no such card, `card`,
        `spend` and `latestTransactions` are `null`, so the app can show an
        empty state instead of an error.

        All numbers are read from one database snapshot, so `spend`,
        `latestTransactions` and `totalCount` always agree with each other.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Overview for the selected company
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardOverview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cards/{cardId}/transactions:
    get:
      operationId: listCardTransactions
      tags: [Cards]
      summary: Paginated transactions for a card ("54 more items" view)
      description: |
        Newest first. Cursor-based pagination, so new transactions arriving
        while the user scrolls never cause duplicates or skipped rows.
      parameters:
        - $ref: '#/components/parameters/CardId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: Opaque value from `nextCursor` of the previous page
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: One page of transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cards/{cardId}/activation:
    post:
      operationId: activateCard
      tags: [Cards]
      summary: Activate the card ("Activate card" button)
      description: |
        The user proves they have the physical card by entering its last 4
        digits (they are hidden in the app while the card is `INACTIVE`).

        - Idempotent: an already `ACTIVE` card with the right digits returns
          `200`, so a double tap or a network retry is safe.
        - Only the card holder can activate. Other users get `404`.
        - Wrong digits return `422` with `attemptsRemaining`.
        - After 5 wrong attempts activation is locked (`423`) until support
          unlocks it.
        - Rate limited per user across all cards (`429` with `Retry-After`).
      x-fastify-config:
        rateLimit: {}
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [last4]
              properties:
                last4: { type: string, pattern: '^[0-9]{4}$', example: '4821' }
      responses:
        '200':
          description: The card is active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/WrongActivationDigits' }
        '423': { $ref: '#/components/responses/ActivationLocked' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Money:
      type: object
      required: [minor, currency]
      properties:
        minor:
          type: integer
          description: Amount in minor units (öre). 540000 = 5 400,00 kr
          example: 540000
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: SEK

    CompanySummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Company AB }

    CardStatus:
      type: string
      enum: [INACTIVE, ACTIVE, FROZEN, CLOSED]

    Card:
      type: object
      required: [id, last4, status, imageUrl]
      properties:
        id: { type: string, format: uuid }
        last4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          example: '4821'
          description: null while the card is INACTIVE (the digits are the activation proof)
        status: { $ref: '#/components/schemas/CardStatus' }
        imageUrl: { type: string, format: uri }

    InvoiceDue:
      type: object
      required: [id, amount, dueDate, isOverdue]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        dueDate: { type: string, format: date, example: '2026-10-30' }
        isOverdue: { type: boolean }

    Spend:
      type: object
      description: |
        Spend in the current calendar month (Europe/Stockholm) against the
        limit the user set. Pending and settled purchases count, refunds
        reduce spend, declined transactions are ignored. `spent` never goes
        below 0, so a refund for last month's purchase cannot push
        `remaining` above `limit`.
      required: [spent, limit, remaining, periodStart, periodEnd]
      properties:
        spent: { $ref: '#/components/schemas/Money' }
        limit: { $ref: '#/components/schemas/Money' }
        remaining:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: max(limit - spent, 0). Never negative.
        periodStart: { type: string, format: date }
        periodEnd:
          type: string
          format: date
          description: Last day of the period (inclusive)

    Transaction:
      type: object
      required: [id, merchant, amount, status, occurredAt]
      properties:
        id: { type: string, format: uuid }
        merchant: { type: string, example: Clas Ohlson }
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Negative = purchase, positive = refund
        status:
          type: string
          enum: [PENDING, SETTLED, DECLINED]
        occurredAt: { type: string, format: date-time }

    LatestTransactions:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Transaction' }
        totalCount:
          type: integer
          minimum: 0
          description: All transactions on the card. "N more" = totalCount - items.length

    Actions:
      type: object
      description: Decided by the backend so business rules live in one place
      required: [canActivateCard, activationBlockedReason]
      properties:
        canActivateCard: { type: boolean }
        activationBlockedReason:
          type: [string, 'null']
          enum: [NO_CARD, NOT_INACTIVE, LOCKED, null]
          description: |
            Why activation is not possible, so the app can show the right text
            without its own rules. null when `canActivateCard` is true.
            LOCKED means too many wrong attempts: show "Contact support".

    Support:
      type: object
      required: [phone, email, url]
      properties:
        phone: { type: string, example: '+46 8 000 00 00' }
        email: { type: string, format: email }
        url: { type: string, format: uri }

    CardOverview:
      type: object
      required: [company, card, invoiceDue, spend, latestTransactions, actions, support]
      properties:
        company: { $ref: '#/components/schemas/CompanySummary' }
        card:
          oneOf: [{ $ref: '#/components/schemas/Card' }, { type: 'null' }]
        invoiceDue:
          description: |
            The oldest unpaid invoice. null when nothing is due, or when the
            user is not OWNER or ADMIN of the company.
          oneOf: [{ $ref: '#/components/schemas/InvoiceDue' }, { type: 'null' }]
        spend:
          oneOf: [{ $ref: '#/components/schemas/Spend' }, { type: 'null' }]
        latestTransactions:
          oneOf: [{ $ref: '#/components/schemas/LatestTransactions' }, { type: 'null' }]
        actions: { $ref: '#/components/schemas/Actions' }
        support: { $ref: '#/components/schemas/Support' }

    TransactionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        nextCursor:
          type: [string, 'null']
          description: null on the last page

    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type: { type: string, example: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    ActivationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [attemptsRemaining]
          properties:
            attemptsRemaining: { type: integer, minimum: 0, maximum: 5 }

  responses:
    BadRequest:
      description: Invalid input (bad id, limit or cursor)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: |
        Not found, or the user has no access. We do not reveal whether a
        resource exists to users who cannot see it.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        The card cannot be activated: it is FROZEN or CLOSED, or already
        ACTIVE and the digits do not match.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    WrongActivationDigits:
      description: The digits do not match the card
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ActivationProblem' }
    ActivationLocked:
      description: Too many wrong attempts. Only support can unlock activation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: The body is not application/json
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Too many requests from this user. Wait `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds until the user can try again
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Database not reachable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
