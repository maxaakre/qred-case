openapi: 3.1.0
info:
  title: Card Overview API
  version: 1.0.0
  description: |
    Backend for the card overview screen in the mobile app: the company switcher,
    the card, "Invoice due", spend against the user's own limit, the latest
    transactions, "Activate card" and "Contact Qred's support".

    This file is the contract. Everything the app needs to build the screen is
    here; if something is missing, the contract is wrong, not your reading of it.

    ## Building the screen

    1. **Company switcher:** `GET /v1/me/companies`. Sorted by name. The app
       chooses which company to show first (for example the last one the user
       picked, otherwise the first item). An empty list means the user belongs
       to no company: show an empty state.
    2. **The screen:** `GET /v1/companies/{companyId}/card-overview`. One call
       returns everything below the switcher. Call it again when the user
       switches company, returns to the screen, pulls to refresh, or after an
       activation. Responses are never cached (`Cache-Control: no-store`), so
       they are always current.
    3. **"54 more items in transaction view":** show it when
       `latestTransactions.totalCount > latestTransactions.items.length`, with
       the difference as the number. Tapping it opens
       `GET /v1/cards/{cardId}/transactions`, which starts from the newest
       transaction (the 3 already shown included).
    4. **"Activate card":** show the button when `actions.canActivateCard` is
       true. Ask for the last 4 digits printed on the card and send them to
       `POST /v1/cards/{cardId}/activation`. On `200`, call the overview again.
    5. **"Contact Qred's support":** always available in `support`.

    ## Showing errors to users

    Errors are RFC 9457 `application/problem+json`. `title` and `detail` are
    English text for developers and logs: **never show them to users.** Choose
    the user's text from the HTTP status and the extra fields below.

    | Status | Meaning | What the app does |
    |---|---|---|
    | 400 | The request is malformed (bad id, limit, cursor or body) | A bug in the app. On transactions, an invalid cursor: reload from the first page |
    | 401 | Token missing, invalid or expired | Sign the user in again |
    | 404 | Does not exist, or the user has no access (the API does not say which) | On the overview: the user may have left the company; reload the company list |
    | 409 | The card cannot be activated in its current state | Reload the overview; it shows the current state |
    | 422 | Wrong activation digits | "Wrong digits, N attempts left" from `attemptsRemaining` |
    | 423 | Activation locked after 5 wrong attempts | Show the contact options from `support` |
    | 429 | Too many attempts | Wait `Retry-After` seconds before allowing another try |
    | 5xx, 503 | Server or database problem | "Something went wrong, try again"; retry with backoff |

    ## Formats

    - **Money** is `{ minor, currency }`: an integer in the currency's minor
      unit (öre for SEK), never a float. `{ "minor": 540000, "currency": "SEK" }`
      is 5 400,00 kr. Format on the device, for example
      `new Intl.NumberFormat('sv-SE', { style: 'currency', currency, maximumFractionDigits: 0 }).format(minor / 100)`
      gives "5 400 kr".
    - **Timestamps** (`occurredAt`) are ISO 8601 in UTC. Show them in the
      user's time zone.
    - **Dates** (`dueDate`, `periodStart`, `periodEnd`) are `YYYY-MM-DD`
      calendar dates in Swedish time. Show them as they are; do not convert
      time zones.
    - **`null`** means "nothing to show" (no card, no invoice due), never an error.

    ## Auth

    Every endpoint except `/health` needs `Authorization: Bearer <token>`. The
    token identifies the user; what they may see is decided by the backend on
    every request. In production the token comes from the app's sign-in
    (BankID); this case uses locally signed demo tokens.

    ## Headers

    - Every response has an `X-Request-Id`. Send your own (letters, digits,
      `.`, `_`, `-`, max 128) to follow one request from the app through the
      backend logs; otherwise the backend creates one. Include it in bug reports.
    - Every response has `Cache-Control: no-store`: the data is personal, so
      neither the app's HTTP cache nor any proxy keeps it. Fetch again instead.
    - Activation responses carry `X-RateLimit-Limit`, `X-RateLimit-Remaining`
      and `X-RateLimit-Reset`.

    ## Mock server

    The same contract runs as a mock on `http://localhost:4010`
    (`docker compose up` or `npm run mock`). Every state of the screen has a
    named example; pick one with the `Prefer` header, for example
    `Prefer: example=inactiveCard` or `Prefer: code=423`.
servers:
  - url: http://localhost:3000
    description: Local backend
  - url: http://localhost:4010
    description: Prism mock server

security:
  - bearerAuth: []

tags:
  - name: Companies
    description: Companies the signed-in user belongs to
  - name: Cards
    description: The user's card, spend, transactions and actions
  - name: System
    description: Operational endpoints

paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Liveness and database readiness
      description: For load balancers and monitoring. The app does not need it.
      security: []
      responses:
        '200':
          description: Service and database are up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/me/companies:
    get:
      operationId: listMyCompanies
      tags: [Companies]
      summary: Companies the user belongs to (the company dropdown)
      description: |
        Sorted by name. Never paginated: a user belongs to a handful of
        companies. An empty `items` means the user belongs to no company.
      responses:
        '200':
          description: The user's companies, sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CompanySummary' }
              examples:
                twoCompanies:
                  summary: Member of two companies
                  value:
                    items:
                      - { id: 01922f6e-7d1a-7c3e-9b2a-5d4e3f2a1b02, name: Bygg Norr AB }
                      - { id: 01922f6e-7d1a-7c3e-9b2a-5d4e3f2a1b01, name: Company AB }
                noCompanies:
                  summary: Member of no company
                  value: { items: [] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/companies/{companyId}/card-overview:
    get:
      operationId: getCardOverview
      tags: [Cards]
      summary: Everything the card overview screen needs, in one call
      description: |
        Screen-shaped (Backend-for-Frontend) endpoint: the signed-in user's
        card in the selected company, with spend, the latest transactions, the
        next invoice due, which actions are allowed, and support contacts.

        - **Which card:** the user's most recently created card in the company
          that is not `CLOSED`. `FROZEN` cards are shown so the user understands
          why the card does not work.
        - **No card:** if the user is a member but has no such card, `card`,
          `spend` and `latestTransactions` are `null`: show an empty state.
        - **Consistent numbers:** everything is read from one database
          snapshot, so `spend`, `latestTransactions` and `totalCount` always
          agree with each other.

        The examples show every state the screen can be in.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Overview for the selected company
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardOverview' }
              examples:
                activeCard:
                  summary: Active card, owner (the design)
                  value:
                    company: { id: 01922f6e-7d1a-7c3e-9b2a-5d4e3f2a1b01, name: Company AB }
                    card:
                      id: 01922f6e-8a10-7f00-a111-0c5e1d2b3a01
                      last4: '4821'
                      status: ACTIVE
                      imageUrl: https://cdn.example.com/cards/black.png
                    invoiceDue:
                      id: 01922f6e-9b20-7a00-b222-1d6f2e3c4b01
                      amount: { minor: 387500, currency: SEK }
                      dueDate: '2026-10-31'
                      isOverdue: false
                    spend:
                      spent: { minor: 460000, currency: SEK }
                      limit: { minor: 1000000, currency: SEK }
                      remaining: { minor: 540000, currency: SEK }
                      periodStart: '2026-10-01'
                      periodEnd: '2026-10-31'
                    latestTransactions:
                      items:
                        - id: 01922f6e-a001-7000-8000-000000000003
                          merchant: Clas Ohlson
                          amount: { minor: -95200, currency: SEK }
                          status: PENDING
                          occurredAt: '2026-10-12T07:41:00Z'
                        - id: 01922f6e-a001-7000-8000-000000000002
                          merchant: Circle K
                          amount: { minor: 25000, currency: SEK }
                          status: SETTLED
                          occurredAt: '2026-10-10T15:02:00Z'
                        - id: 01922f6e-a001-7000-8000-000000000001
                          merchant: Bauhaus
                          amount: { minor: -64900, currency: SEK }
                          status: SETTLED
                          occurredAt: '2026-10-08T11:20:00Z'
                      totalCount: 57
                    actions: { canActivateCard: false, activationBlockedReason: NOT_INACTIVE }
                    support: { phone: '+46 8 000 00 00', email: support@example.com, url: 'https://example.com/support' }
                inactiveCard:
                  summary: New card waiting for activation, employee (no invoice)
                  value:
                    company: { id: 01922f6e-7d1a-7c3e-9b2a-5d4e3f2a1b01, name: Company AB }
                    card:
                      id: 01922f6e-8a10-7f00-a111-0c5e1d2b3a02
                      last4: null
                      status: INACTIVE
                      imageUrl: https://cdn.example.com/cards/black.png
                    invoiceDue: null
                    spend:
                      spent: { minor: 0, currency: SEK }
                      limit: { minor: 500000, currency: SEK }
                      remaining: { minor: 500000, currency: SEK }
                      periodStart: '2026-10-01'
                      periodEnd: '2026-10-31'
                    latestTransactions: { items: [], totalCount: 0 }
                    actions: { canActivateCard: true, activationBlockedReason: null }
                    support: { phone: '+46 8 000 00 00', email: support@example.com, url: 'https://example.com/support' }
                activationLocked:
                  summary: Inactive card locked after 5 wrong attempts
                  value:
                    company: { id: 01922f6e-7d1a-7c3e-9b2a-5d4e3f2a1b01, name: Company AB }
                    card:
                      id: 01922f6e-8a10-7f00-a111-0c5e1d2b3a02
                      last4: null
                      status: INACTIVE
                      imageUrl: https://cdn.example.com/cards/black.png
                    invoiceDue: null
                    spend:
                      spent: { minor: 0, currency: SEK }
                      limit: { minor: 500000, currency: SEK }
                      remaining: { minor: 500000, currency: SEK }
                      periodStart: '2026-10-01'
                      periodEnd: '2026-10-31'
                    latestTransactions: { items: [], totalCount: 0 }
                    actions: { canActivateCard: false, activationBlockedReason: LOCKED }
                    support: { phone: '+46 8 000 00 00', email: support@example.com, url: 'https://example.com/support' }
                frozenCard:
                  summary: Frozen card, over the limit, invoice overdue
                  value:
                    company: { id: 01922f6e-7d1a-7c3e-9b2a-5d4e3f2a1b01, name: Company AB }
                    card:
                      id: 01922f6e-8a10-7f00-a111-0c5e1d2b3a01
                      last4: '4821'
                      status: FROZEN
                      imageUrl: https://cdn.example.com/cards/black.png
                    invoiceDue:
                      id: 01922f6e-9b20-7a00-b222-1d6f2e3c4b01
                      amount: { minor: 387500, currency: SEK }
                      dueDate: '2026-09-30'
                      isOverdue: true
                    spend:
                      spent: { minor: 1120000, currency: SEK }
                      limit: { minor: 1000000, currency: SEK }
                      remaining: { minor: 0, currency: SEK }
                      periodStart: '2026-10-01'
                      periodEnd: '2026-10-31'
                    latestTransactions:
                      items:
                        - id: 01922f6e-a001-7000-8000-000000000004
                          merchant: Webhallen
                          amount: { minor: -300000, currency: SEK }
                          status: DECLINED
                          occurredAt: '2026-10-11T09:15:00Z'
                      totalCount: 1
                    actions: { canActivateCard: false, activationBlockedReason: NOT_INACTIVE }
                    support: { phone: '+46 8 000 00 00', email: support@example.com, url: 'https://example.com/support' }
                noCard:
                  summary: Member of the company without a card (empty state)
                  value:
                    company: { id: 01922f6e-7d1a-7c3e-9b2a-5d4e3f2a1b02, name: Bygg Norr AB }
                    card: null
                    invoiceDue: null
                    spend: null
                    latestTransactions: null
                    actions: { canActivateCard: false, activationBlockedReason: NO_CARD }
                    support: { phone: '+46 8 000 00 00', email: support@example.com, url: 'https://example.com/support' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cards/{cardId}/transactions:
    get:
      operationId: listCardTransactions
      tags: [Cards]
      summary: Paginated transactions for a card ("54 more items" view)
      description: |
        All transactions on the card, newest first, including the 3 shown on
        the overview. Declined transactions are listed too (style them as
        declined); they do not count towards spend.

        **Paging:** call without `cursor` for the first page. While
        `nextCursor` is not `null`, pass it as `cursor` to get the next page.
        New transactions that arrive while the user scrolls never cause
        duplicates or skipped rows; they appear when the list is reloaded from
        the first page. If a cursor is rejected (`400`), reload from the first
        page.

        `cardId` comes from `card.id` in the overview.
      parameters:
        - $ref: '#/components/parameters/CardId'
        - name: limit
          in: query
          description: Page size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: Opaque value from `nextCursor` of the previous page. Do not build or parse it.
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: One page of transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
              examples:
                firstPage:
                  summary: A page with more to load
                  value:
                    items:
                      - id: 01922f6e-a001-7000-8000-000000000003
                        merchant: Clas Ohlson
                        amount: { minor: -95200, currency: SEK }
                        status: PENDING
                        occurredAt: '2026-10-12T07:41:00Z'
                      - id: 01922f6e-a001-7000-8000-000000000002
                        merchant: Circle K
                        amount: { minor: 25000, currency: SEK }
                        status: SETTLED
                        occurredAt: '2026-10-10T15:02:00Z'
                    nextCursor: MDE5MjJmNmUtYTAwMS03MDAwLTgwMDAtMDAwMDAwMDAwMDAy
                lastPage:
                  summary: The last page
                  value:
                    items:
                      - id: 01922f6e-a001-7000-8000-000000000001
                        merchant: Bauhaus
                        amount: { minor: -64900, currency: SEK }
                        status: SETTLED
                        occurredAt: '2026-10-08T11:20:00Z'
                    nextCursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cards/{cardId}/activation:
    post:
      operationId: activateCard
      tags: [Cards]
      summary: Activate the card ("Activate card" button)
      description: |
        The user proves they have the physical card by entering its last 4
        digits. The app does not know them: `last4` is `null` while the card is
        `INACTIVE`.

        - **Idempotent:** an already `ACTIVE` card with the right digits returns
          `200`, so a double tap or a network retry is safe.
        - **Only the card holder** can activate. Other users get `404`.
        - **Wrong digits** return `422` with `attemptsRemaining`.
        - **After 5 wrong attempts** activation is locked (`423`) until support
          unlocks it. The overview then shows `activationBlockedReason: LOCKED`.
        - **Rate limited** per user across all cards: `429` with `Retry-After`.

        After `200`, call the overview again: the card shows its digits and
        the button disappears.
      x-fastify-config:
        rateLimit: {}
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [last4]
              properties:
                last4:
                  type: string
                  pattern: '^[0-9]{4}$'
                  description: The last 4 digits printed on the card, as typed by the user
                  example: '4821'
      responses:
        '200':
          description: The card is active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
              example:
                id: 01922f6e-8a10-7f00-a111-0c5e1d2b3a02
                last4: '7310'
                status: ACTIVE
                imageUrl: https://cdn.example.com/cards/black.png
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/WrongActivationDigits' }
        '423': { $ref: '#/components/responses/ActivationLocked' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A JWT whose subject is the user id. Missing, invalid or expired tokens get `401`.

  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      description: '`id` from `GET /v1/me/companies`'
      schema: { type: string, format: uuid }
    CardId:
      name: cardId
      in: path
      required: true
      description: '`card.id` from the overview'
      schema: { type: string, format: uuid }

  schemas:
    Money:
      type: object
      description: An exact amount. Format on the device, never do arithmetic on floats.
      required: [minor, currency]
      properties:
        minor:
          type: integer
          description: Amount in the currency's minor unit (öre for SEK). 540000 = 5 400,00 kr
          example: 540000
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 code
          example: SEK

    CompanySummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Company AB }

    CardStatus:
      type: string
      enum: [INACTIVE, ACTIVE, FROZEN, CLOSED]
      description: |
        - `INACTIVE`: issued but not activated yet; it cannot be used. Offer
          "Activate card" when `actions.canActivateCard` is true.
        - `ACTIVE`: in use.
        - `FROZEN`: temporarily blocked by Qred; purchases are declined. Explain
          this and point to support.
        - `CLOSED`: no longer usable. Never returned by the overview; only seen
          when a closed card's transactions are opened.

    Card:
      type: object
      required: [id, last4, status, imageUrl]
      properties:
        id: { type: string, format: uuid }
        last4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          example: '4821'
          description: |
            The last 4 digits, to show as "•••• 4821". `null` while the card is
            `INACTIVE`, because the digits are the activation proof.
        status: { $ref: '#/components/schemas/CardStatus' }
        imageUrl:
          type: string
          format: uri
          description: Image of the card design, for the card on the screen

    InvoiceDue:
      type: object
      description: The "Invoice due" row
      required: [id, amount, dueDate, isOverdue]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        dueDate:
          type: string
          format: date
          description: Last day to pay, in Swedish time
          example: '2026-10-30'
        isOverdue:
          type: boolean
          description: True from the day after `dueDate`. Highlight the row.

    Spend:
      type: object
      description: |
        The "Remaining spend: 5 400/10 000 kr, based on your set limit" block,
        which is `remaining` / `limit`: spend in the current calendar month
        (Swedish time) against the limit the user chose.

        Pending and settled purchases count, refunds reduce spend, declined
        transactions are ignored.

        - `spent`: spent this month. Never negative, even after a refund for
          last month's purchase.
        - `limit`: the spend limit the user set.
        - `remaining`: never negative.
        - A progress bar is `spent / limit`. `spent` can be above `limit`, so
          cap the bar at full.
      required: [spent, limit, remaining, periodStart, periodEnd]
      properties:
        spent: { $ref: '#/components/schemas/Money' }
        limit: { $ref: '#/components/schemas/Money' }
        remaining:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: max(limit - spent, 0). Never negative.
        periodStart:
          type: string
          format: date
          description: First day of the month
        periodEnd:
          type: string
          format: date
          description: Last day of the month (inclusive)

    Transaction:
      type: object
      required: [id, merchant, amount, status, occurredAt]
      properties:
        id: { type: string, format: uuid }
        merchant: { type: string, example: Clas Ohlson, description: Name to show }
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Negative = purchase, positive = refund
        status:
          type: string
          enum: [PENDING, SETTLED, DECLINED]
          description: |
            - `PENDING`: reserved, not final yet; the amount can still change.
            - `SETTLED`: final.
            - `DECLINED`: the purchase was refused; show it as declined. It does
              not count towards spend.
        occurredAt:
          type: string
          format: date-time
          description: When the purchase was made, in UTC. Show in the user's time zone.

    LatestTransactions:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          maxItems: 3
          description: The 3 newest transactions, newest first
          items: { $ref: '#/components/schemas/Transaction' }
        totalCount:
          type: integer
          minimum: 0
          description: All transactions on the card. "N more" = totalCount - items.length

    Actions:
      type: object
      description: What the user may do. Decided by the backend; the app has no rules of its own.
      required: [canActivateCard, activationBlockedReason]
      properties:
        canActivateCard:
          type: boolean
          description: Show the "Activate card" button
        activationBlockedReason:
          type: [string, 'null']
          enum: [NO_CARD, NOT_INACTIVE, LOCKED, null]
          description: |
            Why the button is hidden. `null` when `canActivateCard` is true.

            - `NO_CARD`: the user has no card in this company (empty state).
            - `NOT_INACTIVE`: the card is already active, frozen or closed.
              Nothing to show.
            - `LOCKED`: too many wrong digits. Show "Contact support" with the
              options from `support`.

    Support:
      type: object
      description: The "Contact Qred's support" options
      required: [phone, email, url]
      properties:
        phone:
          type: string
          description: Formatted for display. Remove spaces for a `tel:` link.
          example: '+46 8 000 00 00'
        email: { type: string, format: email, example: support@example.com }
        url: { type: string, format: uri, description: Help pages, example: 'https://example.com/support' }

    CardOverview:
      type: object
      required: [company, card, invoiceDue, spend, latestTransactions, actions, support]
      properties:
        company: { $ref: '#/components/schemas/CompanySummary' }
        card:
          description: '`null` when the user has no card in this company'
          oneOf: [{ $ref: '#/components/schemas/Card' }, { type: 'null' }]
        invoiceDue:
          description: |
            The oldest unpaid invoice. `null` when nothing is due, or when the
            user is not OWNER or ADMIN of the company: hide the row.
          oneOf: [{ $ref: '#/components/schemas/InvoiceDue' }, { type: 'null' }]
        spend:
          description: '`null` when the user has no card in this company'
          oneOf: [{ $ref: '#/components/schemas/Spend' }, { type: 'null' }]
        latestTransactions:
          description: '`null` when the user has no card in this company'
          oneOf: [{ $ref: '#/components/schemas/LatestTransactions' }, { type: 'null' }]
        actions: { $ref: '#/components/schemas/Actions' }
        support: { $ref: '#/components/schemas/Support' }

    TransactionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Newest first
          items: { $ref: '#/components/schemas/Transaction' }
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page. `null` on the last page.

    Problem:
      type: object
      description: |
        RFC 9457 problem details. `title` and `detail` are English text for
        developers and logs; never show them to users. Use the HTTP status (and
        fields such as `attemptsRemaining`) to choose the user's text.
      required: [type, title, status]
      properties:
        type: { type: string, example: 'about:blank' }
        title: { type: string, description: The HTTP reason phrase }
        status: { type: integer, description: Same as the HTTP status }
        detail: { type: string, description: 'What went wrong, for developers' }
        instance: { type: string, description: The request path }

    ActivationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [attemptsRemaining]
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              maximum: 5
              description: Wrong attempts left before activation locks. At 0 the next attempt gets `423`.

  responses:
    BadRequest:
      description: The request is malformed (bad id, limit, cursor or body). A bug in the app, except an expired cursor.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'about:blank', title: Bad Request, status: 400, detail: Invalid cursor, instance: /v1/cards/01922f6e-8a10-7f00-a111-0c5e1d2b3a01/transactions }
    Unauthorized:
      description: Token missing, invalid or expired. Sign the user in again.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'about:blank', title: Unauthorized, status: 401, detail: Missing or invalid bearer token, instance: /v1/me/companies }
    NotFound:
      description: |
        Does not exist, or the user has no access. The API does not reveal
        which, so other customers' ids cannot be probed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'about:blank', title: Not Found, status: 404, detail: Company not found, instance: /v1/companies/01922f6e-7d1a-7c3e-9b2a-5d4e3f2a1b09/card-overview }
    Conflict:
      description: |
        The card cannot be activated in its current state: it is FROZEN or
        CLOSED, or already ACTIVE and the digits do not match. Reload the overview.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'about:blank', title: Conflict, status: 409, detail: A FROZEN card cannot be activated, instance: /v1/cards/01922f6e-8a10-7f00-a111-0c5e1d2b3a01/activation }
    WrongActivationDigits:
      description: The digits do not match the card. Show how many attempts are left.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ActivationProblem' }
          example: { type: 'about:blank', title: Unprocessable Content, status: 422, detail: The digits do not match the card, instance: /v1/cards/01922f6e-8a10-7f00-a111-0c5e1d2b3a02/activation, attemptsRemaining: 4 }
    ActivationLocked:
      description: Too many wrong attempts. Only support can unlock activation; show the options from `support`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'about:blank', title: Locked, status: 423, detail: 'Too many wrong attempts. Contact support to unlock activation.', instance: /v1/cards/01922f6e-8a10-7f00-a111-0c5e1d2b3a02/activation }
    UnsupportedMediaType:
      description: The body is not `application/json`. A bug in the app.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Too many attempts from this user. Wait `Retry-After` seconds before allowing another try.
      headers:
        Retry-After:
          description: Seconds until the user can try again
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'about:blank', title: Too Many Requests, status: 429, detail: 'Too many attempts. Try again in 15 minutes.', instance: /v1/cards/01922f6e-8a10-7f00-a111-0c5e1d2b3a02/activation }
    ServiceUnavailable:
      description: The database cannot be reached
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
